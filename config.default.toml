preview_cmd = "snapper -c root list 2>/dev/null | tail -n 10 || echo 'No snapshots found'"
requires_sudo = false
confirm = false
deps = ["snapper", "fzf"]

[commands.snap-clean]
category = "System Architecture & BTRFS Snapshotting"
description = "Prune old or orphaned system snapshots"
command = "sudo snapper -c root cleanup number && sudo snapper -c root cleanup timeline && echo '✔ Old snapshots pruned.'"
preview_cmd = "snapper -c root list 2>/dev/null | wc -l | awk '{print $1 \" snapshots currently stored.\"}'"
requires_sudo = true
confirm = true
deps = ["snapper"]

[commands.fkill]
category = "System Architecture & BTRFS Snapshotting"
description = "Interactive multi-select process terminator with live CPU/RAM previews"
