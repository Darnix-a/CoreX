preview_cmd = "ps -eo pid,user,%cpu,%mem,comm --sort=-%cpu | head -n 10"
requires_sudo = false
confirm = false
deps = ["fzf", "ps"]

[commands.disk-space]
category = "System Architecture & BTRFS Snapshotting"
description = "Interactive visual disk usage explorer via ncdu or dust"
command = "ncdu ~ 2>/dev/null || dust ~ 2>/dev/null || df -h"
preview_cmd = "df -h -x tmpfs -x devtmpfs 2>/dev/null"
requires_sudo = false
confirm = false
deps = []

[commands.pkg-orphans]
category = "System Architecture & BTRFS Snapshotting"
description = "Scan and remove unneeded package dependencies and clean package cache"
command = "if command -v pacman >/dev/null 2>&1; then orphans=$(pacman -Qdtq 2>/dev/null) && [ -n \"$orphans\" ] && sudo pacman -Rns $orphans || echo '✔ No orphaned packages found.'; elif command -v apt-get >/dev/null 2>&1 || command -v apt >/dev/null 2>&1; then sudo apt autoremove; elif command -v dnf5 >/dev/null 2>&1 || command -v dnf >/dev/null 2>&1; then sudo dnf autoremove; elif command -v zypper >/dev/null 2>&1; then sudo zypper packages --orphaned; else echo 'No supported package manager found.'; fi"
preview_cmd = "if command -v pacman >/dev/null 2>&1; then pacman -Qdtq 2>/dev/null || echo 'No orphaned packages'; elif command -v apt >/dev/null 2>&1; then echo 'Cleans unused packages via apt autoremove'; elif command -v dnf >/dev/null 2>&1; then echo 'Cleans unused packages via dnf autoremove'; else echo 'Clean orphaned packages'; fi"
requires_sudo = true
confirm = true
deps = []

[commands.service-fail]
category = "System Architecture & BTRFS Snapshotting"
description = "List all failed systemd system and user services (systemctl --failed)"
command = "echo -e '\\033[1;31m=== Failed System Services ===\\033[0m' && systemctl --failed && echo -e '\\n\\033[1;33m=== Failed User Services ===\\033[0m' && systemctl --user --failed"
preview_cmd = "systemctl --failed --no-legend 2>/dev/null | wc -l | awk '{print $1 \" failed services\"}'"
requires_sudo = false
confirm = false
deps = ["systemctl"]

[commands.journal-vacuum]
category = "System Architecture & BTRFS Snapshotting"
description = "Trim systemd logs to under 200MB"
command = "sudo journalctl --vacuum-size=200M"
preview_cmd = "journalctl --disk-usage 2>/dev/null"
requires_sudo = true
confirm = false
deps = ["journalctl"]

[commands.boot-analyze]
category = "System Architecture & BTRFS Snapshotting"
description = "Profile kernel and userspace boot duration via systemd-analyze blame"
