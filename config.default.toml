# CoreX (cx) - 75+ Command Mission-Control Workstation Engine Configuration
# Location: ~/.config/corex/config.toml

[general]
editor = ""                            # Default editor ($EDITOR, nvim, micro, nano, vi)
notes_dir = "~/.local/share/corex/notes" # Notes directory
todo_file = "~/.local/share/corex/todo.json" # Todo tracking file
color = true

[ai]
comfyui_path = "~/ComfyUI"             # Root directory of ComfyUI
comfyui_venv = "venv"                  # Virtualenv subfolder
comfyui_port = 8188
comfyui_host = "127.0.0.1"
vram_high_threshold_mb = 8192
vram_low_threshold_mb = 4096
comfyui_extra_flags = ["--preview-method", "auto"]
comfyui_auto_browser = true
comfyui_notify = true
ollama_url = "http://127.0.0.1:11434"

# ==============================================================================
# 1. AI, CUDA & DEEP LEARNING (12 Commands)
# ==============================================================================

[commands.comfy-boot]
category = "AI, CUDA & Deep Learning"
description = "Detect venv, check port 8188, apply CUDA alloc flags, launch ComfyUI & notify"
command = "cx __builtin comfy-boot"
preview_cmd = "ss -tulpn | grep 8188 || echo 'Port 8188 ready for ComfyUI boot'"
requires_sudo = false
confirm = false
deps = ["python3"]

[commands.comfy-nuke]
category = "AI, CUDA & Deep Learning"
description = "Force kill any zombie ComfyUI server and associated Python/Torch memory holders"
command = "pkill -9 -f 'main.py.*comfy' 2>/dev/null || pkill -9 -f 'ComfyUI/main.py' 2>/dev/null || fuser -k 8188/tcp 2>/dev/null; echo '✔ ComfyUI instances nuked.'"
preview_cmd = "ss -tulpn | grep 8188 || echo 'Port 8188 clear'"
requires_sudo = false
confirm = true
deps = ["pkill"]

[commands.comfy-sync]
category = "AI, CUDA & Deep Learning"
description = "Parallel git-pull across ComfyUI core and all cloned custom_nodes directories"
command = "cd ~/ComfyUI && echo -e '\\033[1;36m==> Syncing ComfyUI Core...\\033[0m' && git pull && find custom_nodes -mindepth 1 -maxdepth 1 -type d -exec sh -c 'cd \"$1\" && [ -d .git ] && echo -e \"\\033[1;34m==> Updating $(basename \"$1\")...\\033[0m\" && git pull' _ {} \\;"
preview_cmd = "cd ~/ComfyUI && git status -sb 2>/dev/null || echo 'ComfyUI not found at ~/ComfyUI'"
requires_sudo = false
confirm = false
deps = ["git"]

[commands.model-symlink]
category = "AI, CUDA & Deep Learning"
description = "Interactive fzf picker to symlink any .safetensors file into target ComfyUI model folder"
command = "cx __builtin model-symlink"
preview_cmd = "find ~/ComfyUI/models -maxdepth 2 -type d 2>/dev/null | head -n 15"
requires_sudo = false
confirm = false
deps = ["fzf"]

[commands.ollama-up]
category = "AI, CUDA & Deep Learning"
description = "Start the Ollama background inference daemon if stopped"
command = "systemctl --user start ollama 2>/dev/null || sudo systemctl start ollama 2>/dev/null || nohup ollama serve >/dev/null 2>&1 & echo '✔ Ollama daemon started.'"
preview_cmd = "systemctl --user is-active ollama 2>/dev/null || echo 'Inactive'"
requires_sudo = false
confirm = false
deps = ["ollama"]

[commands.ollama-ps]
category = "AI, CUDA & Deep Learning"
description = "Display currently loaded models in GPU memory with context memory footprint"
command = "cx __builtin ollama-ps"
preview_cmd = "curl -s http://127.0.0.1:11434/api/ps 2>/dev/null | jq . 2>/dev/null || echo 'Ollama API unreachable'"
requires_sudo = false
confirm = false
deps = ["curl"]

[commands.ollama-drop]
category = "AI, CUDA & Deep Learning"
description = "Unload all active LLMs from VRAM immediately"
command = "cx __builtin ollama-drop"
preview_cmd = "curl -s http://127.0.0.1:11434/api/ps 2>/dev/null || echo 'Ollama API unreachable'"
requires_sudo = false
confirm = false
deps = ["curl"]

[commands.ollama-fzf]
category = "AI, CUDA & Deep Learning"
description = "Interactive fzf selector to run or chat with any locally pulled model"
command = "ollama list | tail -n +2 | fzf --prompt='Select model > ' --height=40% --border | awk '{print $1}' | xargs -r -o ollama run"
preview_cmd = "ollama list 2>/dev/null || echo 'No models found'"
requires_sudo = false
confirm = false
deps = ["ollama", "fzf"]

[commands.hf-download]
category = "AI, CUDA & Deep Learning"
description = "Fast model puller from HuggingFace via aria2c multithreaded resume"
command = "echo -n 'Enter HuggingFace file URL: ' && read -r url && [ -n \"$url\" ] && aria2c -x 16 -s 16 -k 1M -c \"$url\""
preview_cmd = "echo 'Usage: aria2c -x 16 -s 16 -k 1M -c <url>'"
requires_sudo = false
confirm = false
deps = ["aria2c"]

[commands.civit-grab]
category = "AI, CUDA & Deep Learning"
description = "Download model/LoRA from Civitai API key/URL with SHA256 verification"
command = "cx __builtin civit-grab"
preview_cmd = "echo 'Downloads Civitai model/LoRA with optional sha256 checksum check.'"
requires_sudo = false
confirm = false
deps = ["curl"]

[commands.vram-watch]
category = "AI, CUDA & Deep Learning"
description = "Loop nvidia-smi showing per-process memory, power draw, and temperature at 1000ms"
command = "watch -n 1 -c 'nvidia-smi --query-gpu=temperature.gpu,power.draw,memory.used,memory.total --format=csv,noheader && echo && nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv'"
preview_cmd = "nvidia-smi --query-gpu=temperature.gpu,memory.used,memory.total --format=csv 2>/dev/null || echo 'No NVIDIA GPU'"
requires_sudo = false
confirm = false
deps = ["nvidia-smi", "watch"]

[commands.cuda-purge]
category = "AI, CUDA & Deep Learning"
description = "Scan specifically for orphaned Python processes holding /dev/nvidia* file handles and terminate them"
command = "fuser -v /dev/nvidia* 2>&1 | awk '{for(i=1;i<=NF;i++) if($i ~ /^[0-9]+$/) print $i}' | sort -u | xargs -r kill -9 && echo '✔ Terminated rogue GPU file handle holders.'"
preview_cmd = "fuser -v /dev/nvidia* 2>&1 || echo 'No active GPU file handles'"
requires_sudo = false
confirm = true
deps = ["fuser"]

