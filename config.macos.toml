[commands.git-clean-branches]
command = '''
git branch --merged | grep -v -E '^\*|main|master|develop' | while IFS= read -r branch; do
    git branch -d -- "${branch#  }" || exit
done
'''

[commands.clip-hist]
description = "Browse clipboard entries captured by CoreX and copy a selection"
