# macOS variants of the stock action IDs in config.default.toml.
# An unavailable action retains its ID for search, profiles and completion.

[commands.comfy-boot]
preview_cmd = "lsof -nP -iTCP:8188 -sTCP:LISTEN"

[commands.comfy-nuke]
description = "Stop the ComfyUI process listening on the configured local port"
command = "cx __builtin comfy-stop"
preview_cmd = "lsof -nP -iTCP:8188 -sTCP:LISTEN"
deps = ["lsof"]
confirm = true

[commands.ollama-up]
description = "Start the local Ollama daemon in the background"
command = "cx __builtin ollama-start"
preview_cmd = "ollama ps"
deps = ["ollama"]

[commands.ollama-fzf]
command = '''
model=$(ollama list | tail -n +2 | fzf --prompt='Select model > ' | awk '{print $1}')
[ -n "$model" ] && ollama run "$model"
'''

[commands.vram-watch]
description = "Monitor Apple Silicon GPU activity, frequency and unified memory"
command = "sudo powermetrics --samplers gpu_power -i 1000"
preview_cmd = "system_profiler SPDisplaysDataType"
deps = ["powermetrics"]
requires_sudo = true

[commands.cuda-purge]
unavailable = "CUDA and NVIDIA device handles are unavailable on Apple Silicon. Use cx ollama-drop to unload Ollama models."

[commands.pw-restart]
description = "Restart the macOS Core Audio daemon"
command = "sudo launchctl kickstart -k system/com.apple.audio.coreaudiod"
preview_cmd = "system_profiler SPAudioDataType"
deps = ["launchctl"]
requires_sudo = true
confirm = true

[commands.pw-devices]
description = "Inspect Core Audio input and output devices and open Sound settings"
command = "system_profiler SPAudioDataType && open 'x-apple.systempreferences:com.apple.Sound-Settings.extension'"
preview_cmd = "system_profiler SPAudioDataType"
deps = ["system_profiler", "open"]

[commands.pw-volume]
description = "Show or set Core Audio output volume (0–100)"
command = "cx __builtin mac-volume"
preview_cmd = '''osascript -e 'get volume settings' '''
deps = ["osascript"]

[commands.gpu-clock]
unavailable = "Apple Silicon manages GPU clocks automatically. Use cx vram-watch to inspect GPU frequency and utilization."

[commands.cpu-gov]
description = "Inspect and select macOS Automatic or Low Power mode"
command = "cx __builtin mac-power"
preview_cmd = "pmset -g custom"
deps = ["pmset", "fzf"]

[commands.cpu-turboboost]
unavailable = "Apple Silicon has no Intel Turbo Boost or AMD Core Performance Boost. Use cx cpu-gov for macOS power modes."

[commands.mon-res]
