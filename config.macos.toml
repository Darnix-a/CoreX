printf '%s\n' 'Open a supported game in macOS full-screen mode. Game Mode activates automatically; use the Game Mode menu to toggle it.'
'''
preview_cmd = "pmset -g custom"
requires_sudo = false

[commands.snap-now]
description = "Create a Time Machine local snapshot on APFS"
command = "tmutil localsnapshot"
preview_cmd = "tmutil listlocalsnapshots /"
deps = ["tmutil"]

[commands.snap-fzf]
description = "Browse local Time Machine snapshots interactively"
command = "cx __builtin mac-snapshots"
preview_cmd = "tmutil listlocalsnapshots /"
deps = ["tmutil", "fzf"]

[commands.snap-clean]
description = "Ask Time Machine to reclaim up to 1 GiB from local snapshots"
command = "sudo tmutil thinlocalsnapshots / 1073741824 1"
preview_cmd = "tmutil listlocalsnapshots /"
deps = ["tmutil"]
requires_sudo = true
confirm = true

[commands.fkill]
preview_cmd = "ps -Arc -o pid,user,%cpu,%mem,comm | head -n 10"

[commands.disk-space]
preview_cmd = "df -h"

[commands.pkg-orphans]
description = "Remove unused Homebrew formula dependencies"
command = "brew autoremove"
preview_cmd = "brew autoremove --dry-run"
deps = ["brew"]
confirm = true

[commands.service-fail]
description = "List launchd jobs with a nonzero last exit status"
command = '''
printf 'PID\tStatus\tLabel\n'
launchctl list | awk 'NR > 1 && $2 != 0'
'''
preview_cmd = "launchctl list | awk 'NR == 1 || $2 != 0' | head -n 15"
deps = ["launchctl"]

[commands.journal-vacuum]
unavailable = "macOS manages Unified Log retention automatically and has no per-size journal vacuum. Use cx klog-err to inspect kernel errors."

[commands.boot-analyze]
description = "Show macOS boot time, uptime and recent launchd boot events"
command = '''
sysctl kern.boottime
uptime
boot=$(sysctl -n kern.boottime | awk -F'[=,]' '{gsub(/ /, "", $2); print $2}')
[ -n "$boot" ] && log show --start "$(date -r "$boot" '+%Y-%m-%d %H:%M:%S')" --style compact --predicate 'process == "launchd"' | head -n 30
'''
preview_cmd = "sysctl kern.boottime; uptime"
deps = ["sysctl", "log"]

[commands.proc]
description = "Inspect processes, RSS, virtual memory, files and sockets, and manage signals"
deps = ["ps", "fzf", "lsof"]
preview_cmd = "ps -Arc -o pid,user,%cpu,%mem,comm | head -n 12"

[commands.my-ip]
preview_cmd = "ifconfig -a | grep -E '^[^[:space:]]|inet ' | head -n 16"

[commands.vpn-up]
description = "Bring up a WireGuard profile from ~/.config/wireguard or /etc/wireguard"
command = '''
prefix=$(brew --prefix 2>/dev/null || true)
dirs=(/etc/wireguard "$HOME/.config/wireguard")
[ -z "$prefix" ] || dirs+=("$prefix/etc/wireguard")
conf=$(find "${dirs[@]}" -maxdepth 1 \( -type f -o -type l \) -name '*.conf' 2>/dev/null | fzf --prompt='WireGuard profile > ')
[ -n "$conf" ] && sudo "$(command -v wg-quick)" up "$conf"
'''
preview_cmd = "scutil --nc list"
deps = ["fzf", "wg", "wg-quick", "wireguard-go"]

[commands.vpn-down]
description = "Select and disconnect a WireGuard tunnel started with wg-quick"
command = '''
prefix=$(brew --prefix 2>/dev/null || true)
dirs=(/etc/wireguard "$HOME/.config/wireguard")
[ -z "$prefix" ] || dirs+=("$prefix/etc/wireguard")
conf=$(find "${dirs[@]}" -maxdepth 1 \( -type f -o -type l \) -name '*.conf' 2>/dev/null | fzf --prompt='WireGuard profile to disconnect > ')
[ -n "$conf" ] && sudo "$(command -v wg-quick)" down "$conf"
'''
preview_cmd = "scutil --nc list"
deps = ["fzf", "wg", "wg-quick", "wireguard-go"]

[commands.port-audit]
deps = ["lsof", "fzf"]
preview_cmd = "lsof -nP -iTCP -sTCP:LISTEN | head -n 12"

[commands.speedtest]
preview_cmd = "ping -c 2 -W 1000 1.1.1.1 | tail -n 2"

[commands.speed-check]
preview_cmd = "ping -c 2 -W 1000 1.1.1.1 | tail -n 2"

