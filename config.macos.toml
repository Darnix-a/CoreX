command = "cx __builtin mac-native extend"
preview_cmd = "system_profiler SPDisplaysDataType"
deps = ["xcrun"]

[commands.mon-single]
description = "Mirror connected displays onto a single desktop"
command = "cx __builtin mac-native mirror"
preview_cmd = "system_profiler SPDisplaysDataType"
deps = ["xcrun"]

[commands.sens-watch]
description = "Stream macOS thermal pressure and Apple Silicon power telemetry"
