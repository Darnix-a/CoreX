deps = ["pbcopy", "pbpaste", "fzf"]

[commands.qr-read]
description = "Decode a QR code from an image or an interactive macOS screen capture"
command = '''
tmp=$(mktemp -d) || exit
trap 'rm -rf "$tmp"' EXIT
read -r -p 'Image path (Enter for screen selection): ' image
if [ -z "$image" ]; then
    image="$tmp/qr.png"
    screencapture -i "$image"
fi
[ -f "$image" ] && zbarimg -q --raw -- "$image"
'''
preview_cmd = "printf '%s\n' 'Decodes a QR code from an image or screen selection.'"
deps = ["screencapture", "zbarimg"]

[commands.hash-check]
command = '''
read -r -p 'File to hash: ' file
[ -f "$file" ] && shasum -a 256 -- "$file" &&
    case "$file" in -*) md5 -q "./$file" ;; *) md5 -q "$file" ;; esac
'''
deps = ["shasum", "md5"]

[commands.trash-empty]
